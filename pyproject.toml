[project]
name = "monolithic-dev-container"
version = "0.1.0"
description = "Monolithic development container environment"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
