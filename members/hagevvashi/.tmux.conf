# --- Prefix Setup (Emacs Friendly) ---
# Ctrl+x を Prefix に設定
set -g prefix C-x
unbind C-b
# C-x を2回叩くと、中のアプリに C-x を送信 (C-x C-s 等のため)
bind C-x send-prefix

# --- History & Mouse ---
set -g history-limit 50000
set -g mouse on

# --- Mouse Toggle ---
bind m if-shell -F '#{mouse}' 'set -g mouse off' 'set -g mouse on' \; display-message 'Mouse: #{?mouse,ON,OFF}' \; refresh-client -S

# --- Active Pane Visibility (Light Mode Friendly) ---
set -g pane-active-border-style "fg=blue,bg=default"
set -g pane-border-style "fg=colour250"
set -g window-style 'default'
set -g window-active-style 'default'

# --- Status Bar Appearance ---
set -g status-interval 1
set -g status-justify centre
set -g status-bg colour252
set -g status-fg colour235
set -g status-left '#[fg=blue,bold][#S]#[default]'
set -g status-right '#{?mouse,#[fg=green]MOUSE:ON#[default],#[fg=yellow]MOUSE:OFF#[default]} | #[fg=colour238]%Y-%m-%d %H:%M:%S#[default]'

# --- Copy Mode (Pure Emacs Mode) ---
set-window-option -g mode-keys emacs
set -s set-clipboard on
