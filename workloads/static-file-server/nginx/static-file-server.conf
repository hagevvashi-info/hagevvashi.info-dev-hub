# Static File Server - Nginx Configuration
# Reverse proxy to miniserve with MIME type overrides

server {
  listen 4001;
  server_name localhost;

  # Set charset to UTF-8
  charset utf-8;

  # JSON files: use application/json (exception to text/plain default)
  location ~ \.json$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Override Content-Disposition from miniserve
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition "inline";
  }

  # CSS, JavaScript, and HTML: keep original MIME type for UI functionality
  location ~ \.(css|js|mjs|html|htm)$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep original MIME type (text/css, application/javascript, text/html)
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition "inline";
  }

  # Binary files: keep original MIME type and allow download
  # Images, videos, audio, archives, executables, fonts, etc.
  location ~ \.(jpg|jpeg|png|gif|webp|svg|ico|bmp|tiff|pdf|mp4|webm|avi|mov|mkv|mp3|wav|ogg|flac|zip|tar|gz|tgz|7z|rar|bz2|xz|exe|msi|dmg|apk|deb|rpm|woff|woff2|ttf|otf|eot)$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep original Content-Type from miniserve
    # Override only Content-Disposition for inline/attachment control
    proxy_hide_header Content-Disposition;
    # Archives and executables: force download
    add_header Content-Disposition "attachment";
  }

  # Images: allow inline display (override the binary rule above)
  location ~ \.(jpg|jpeg|png|gif|webp|svg|ico|bmp|tiff)$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep original image MIME type, allow inline display
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition "inline";
  }

  # Default: proxy all other requests to miniserve
  # For directories, miniserve returns HTML directory listing - keep it as-is
  # For files with unknown extensions, override to text/plain
  location / {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Only override Content-Disposition (not Content-Type)
    # This allows HTML directory listings to display properly
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition "inline" always;
  }

  # Files with any extension (except binary/json/css/js/html): force text/plain
  # Negative lookahead to exclude specific extensions
  # Matches: /path/to/file.anything (has a dot and extension, but not excluded ones)
  location ~ \.(?!json$|css$|js$|mjs$|html$|htm$|jpg$|jpeg$|png$|gif$|webp$|svg$|ico$|bmp$|tiff$|pdf$|mp4$|webm$|avi$|mov$|mkv$|mp3$|wav$|ogg$|flac$|zip$|tar$|gz$|tgz$|7z$|rar$|bz2$|xz$|exe$|msi$|dmg$|apk$|deb$|rpm$|woff$|woff2$|ttf$|otf$|eot$)[^/]+$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Override to text/plain for unknown extensions
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Disposition;
    add_header Content-Type "text/plain; charset=utf-8";
    add_header Content-Disposition "inline";
  }

  # Files without extension: force text/plain
  # Matches: /bin/dc, /.gitignore (no dot after last slash)
  location ~ /[^./]+$ {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Override to text/plain
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Disposition;
    add_header Content-Type "text/plain; charset=utf-8";
    add_header Content-Disposition "inline";
  }
}