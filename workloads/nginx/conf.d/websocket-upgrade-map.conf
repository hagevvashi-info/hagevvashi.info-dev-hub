# WebSocket Upgrade Map
# This map is required for WebSocket proxy pass to work correctly
#
# Purpose:
#   - Defines how to handle the Connection header for WebSocket upgrades
#   - Used in proxy_set_header Connection $connection_upgrade;
#
# Behavior:
#   - If $http_upgrade has a value (i.e., "websocket"), set $connection_upgrade to "upgrade"
#   - If $http_upgrade is empty, set $connection_upgrade to "close"
#
# Reference:
#   - https://nginx.org/en/docs/http/websocket.html
#   - initiatives/20260125-20260125-process-compose-web-dashboard/TROUBLESHOOTING_websocket_nginx_integration.md

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
