[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:supervisor

[inet_http_server]
port=*:4222
username=admin
password=admin

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock



# ========================================
# 安定稼働が必要なサービス
# ========================================

[program:code-server]
command=code-server --bind-addr 0.0.0.0:4035 --auth password
user=%(ENV_UNAME)s
directory=/home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s
autostart=true
autorestart=false
priority=10
environment=CODE_SERVER_PORT="4035",HOME="/home/%(ENV_UNAME)s"
stdout_logfile=/var/log/supervisor/code-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/code-server-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Redis
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:redis]
command=redis-server /home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s/workloads/redis/redis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/redis-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Nginx (Process Compose Dashboard)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
user=root
priority=10
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# miniserve (Modern File Server UI)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:miniserve]
command=miniserve /home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s --port 5080 --title "MDC" --interfaces 127.0.0.1 --hidden
autostart=true
autorestart=true
user=%(ENV_UNAME)s
priority=10
stdout_logfile=/var/log/supervisor/miniserve.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/miniserve-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Playwright MCP (private service for VS Code Dev Container)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:playwright-mcp]
command=npx @playwright/mcp@latest --port %(ENV_PLAYWRIGHT_MCP_PORT)s --host 127.0.0.1 --headless
autostart=true
autorestart=true
user=%(ENV_UNAME)s
directory=/home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s
priority=10
environment=HOME="/home/%(ENV_UNAME)s"
stdout_logfile=/var/log/supervisor/playwright-mcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/playwright-mcp-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Suspicious Symlink Watcher
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:symlink-watch]
command=/home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s/workloads/supervisord/symlink-watch.sh /home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s
autostart=true
autorestart=true
user=%(ENV_UNAME)s
directory=/home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s
priority=11
environment=HOME="/home/%(ENV_UNAME)s"
stdout_logfile=/var/log/supervisor/symlink-watch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/symlink-watch-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Log Forwarder (統合版)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:log-forwarder]
command=bash -c 'tail -F /var/log/supervisor/*.log /var/log/supervisor/*-error.log /var/log/nginx/*.log 2>&1'
autostart=true
autorestart=true
priority=15  # 全 program より後
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:log-forwarder-monitor]
command=/home/%(ENV_UNAME)s/%(ENV_MDC_REPO_ROOT)s/workloads/supervisord/log-forwarder-monitor.sh
autostart=true
autorestart=true
priority=20  # log-forwarder より後
stdout_logfile=/var/log/supervisor/log-forwarder-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/log-forwarder-monitor-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
