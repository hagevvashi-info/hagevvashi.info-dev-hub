# Redis 設定ファイル (開発環境用 - MDC)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 基本設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# データディレクトリ（Docker volume マウント先）
dir /var/lib/redis

# ポート番号（localhost のみ）
port 6379
bind 127.0.0.1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 永続化設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# AOF 永続化を有効化
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync ポリシー（毎秒同期 - デフォルト）
# always: 全書き込みで同期（最も安全だが遅い）
# everysec: 毎秒同期（バランス型 - 推奨）
# no: OS に任せる（最速だがデータ損失リスク）
appendfsync everysec

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ログ設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ログレベル
# debug: 詳細ログ（開発用）
# verbose: 多めのログ
# notice: 通常のログ（推奨）
# warning: 警告のみ
loglevel notice

# ログ出力先（空文字列 = 標準出力）
# supervisord が stdout/stderr をキャプチャする
logfile ""

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# メモリ管理
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# メモリ制限（開発環境では制限なし）
# 本番環境では適切な値を設定すること
# maxmemory <bytes>
# maxmemory-policy allkeys-lru
