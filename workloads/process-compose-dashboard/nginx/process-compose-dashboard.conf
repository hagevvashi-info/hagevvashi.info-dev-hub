# Process Compose Dashboard - Nginx Configuration
# This configuration serves static HTML dashboard and proxies API/WebSocket requests

server {
    listen 4802;
    server_name localhost;
    
    # Note: access_log and error_log are configured in nginx.conf
    # to output to /dev/stdout and /dev/stderr for supervisord integration
    
    # Root directory for static files
    root /var/www/process-compose-dashboard;
    index index.html;
    
    # Serve static HTML files
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy API requests to process-compose
    location /api/ {
        # Remove /api prefix when proxying
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://localhost:4040;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Proxy Swagger UI requests to process-compose
    location /swagger/ {
        proxy_pass http://localhost:4040/swagger/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Proxy WebSocket requests to process-compose
    location /ws/ {
        # Remove /ws prefix when proxying
        rewrite ^/ws/(.*) /$1 break;
        
        proxy_pass http://localhost:4040;
        proxy_http_version 1.1;
        
        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        
        # Timeouts (longer for WebSocket)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
